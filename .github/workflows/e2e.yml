name: Browser tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build and start production container
        run: docker compose up -d --build --wait --wait-timeout 90
      - name: Check UI and API
        run: |
          curl --fail http://localhost:8080/ | grep 'id="root"'
          curl --fail http://localhost:8080/api/health
      - name: Container diagnostics and cleanup
        if: always()
        run: |
          docker compose logs --tail=100
          docker compose down
  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install application and test dependencies
        run: |
          npm ci
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt
          npx playwright install --with-deps chromium webkit
      - name: Check types, unit tests, API tests, and production build
        run: |
          npm run test:e2e:types
          npm test
          .venv/bin/python -m pytest backend/tests -q
          npm run build
      - name: Exercise browser journeys
        run: npm run test:e2e
      - name: Save report and failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
