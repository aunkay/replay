name: replay
services:
  replay:
    build:
      context: .
      target: runtime
    environment:
      REPLAY_ENGINE_URL: http://engine:8003
      REPLAY_DATA_DIR: /data
    volumes:
      - replay-data:/data
    depends_on:
      engine:
        condition: service_healthy
    restart: unless-stopped
    init: true
    ports:
      - "${REPLAY_BIND_ADDRESS:-0.0.0.0}:${REPLAY_PORT:-8080}:8000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  engine:
    build:
      context: .
      target: engine
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  replay-data:
