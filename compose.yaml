name: replay
services:
  replay:
    build: .
    restart: unless-stopped
    init: true
    ports:
      - "${REPLAY_BIND_ADDRESS:-0.0.0.0}:${REPLAY_PORT:-8080}:8000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
